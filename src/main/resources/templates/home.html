<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Vendas</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar-geral}"></div>
<div class="container mt-4">
    <h1>Bem-vindo, <span sec:authentication="name">usuário</span>!</h1>
    <p class="text-muted">Escolha uma opção:</p>
    <div class="d-flex gap-2">
        <a th:href="@{/produtos}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Gerenciar Produtos</a>
        <a th:href="@{/clientes}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Gerenciar Clientes</a>
        <a th:href="@{/pedidos}" class="btn btn-success">Gerenciar Pedidos</a>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
