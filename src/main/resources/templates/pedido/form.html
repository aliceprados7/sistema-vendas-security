<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar-geral}"></div>
<div class="container mt-5">
    <h2>Iniciar Novo Pedido</h2>
    <div class="card mt-3">
        <div class="card-body">
            <!-- Formulário que envia o clienteId -->
            <form th:action="@{/pedidos/novo}" method="post">
                
                <label for="clienteId" class="form-label">Selecione o Cliente para iniciar o pedido:</label>
                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <select class="form-select" id="clienteId" name="clienteId" required>
                        <option value="" disabled selected>Escolha um cliente...</option>
                        <option th:each="cliente : ${clientes}" 
                                th:value="${cliente.id}" 
                                th:text="${cliente.nomeCompleto}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cart-plus"></i> Abrir Pedido
                    </button>
                    <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
