<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar-geral}"></div>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gerenciar Pedidos</h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Novo Pedido
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Status</th>
                    <th>Valor Total</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}">1</td>
                    <td th:text="${pedido.cliente.nomeCompleto}">Nome do Cliente</td>
                    <td>
                        <span th:if="${pedido.status.name() == 'ATIVO'}" class="badge bg-success">ATIVO</span>
                        <span th:if="${pedido.status.name() == 'CANCELADO'}" class="badge bg-danger">CANCELADO</span>
                    </td>
                    <td th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>
                    <td class="text-center">
                        <a th:href="@{/pedidos/edit/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary" title="Editar/Ver Itens">
                            <i class="bi bi-pencil"></i> Itens
                        </a>
                        <a th:if="${pedido.status.name() == 'ATIVO'}" th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-danger" title="Cancelar Pedido">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="5" class="text-center">Nenhum pedido encontrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
