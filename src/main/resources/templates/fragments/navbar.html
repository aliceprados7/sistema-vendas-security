<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar-geral" class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
    <ul class="navbar-nav me-auto">
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/produtos}">Produtos</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/pedidos}">Pedidos</a>
        </li>
    </ul>
    <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">usuario</span>
    </span>
    <a class="btn btn-outline-light btn-sm" th:href="@{/logout}" sec:authorize="isAuthenticated()">Sair</a>
</nav>
</body>
</html>
