spring.application.name=sistema-vendas

# Variaveis de ambiente (Render) com valores padrao para rodar localmente com docker-compose
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

server.port=${PORT:8080}
# O Render termina o HTTPS num proxy: sem isto, os redirects do login podem sair como http://
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
